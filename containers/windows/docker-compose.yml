name: "winapps" # Docker Compose Project Name.
volumes:
  # Create Volume 'data'.
  # Located @ '/var/lib/docker/volumes/winapps_data/_data'
  data:
services:
  windows:
    image: ghcr.io/dockur/windows:latest
    container_name: WinApps
    env_file:
      - /run/secrets/winapps.env
    environment:
      # Version of Windows to configure. For valid options, visit:
      # https://github.com/dockur/windows?tab=readme-ov-file#how-do-i-select-the-windows-version
      # https://github.com/dockur/windows?tab=readme-ov-file#how-do-i-install-a-custom-image
      VERSION: 11
      # RAM allocated to the Windows VM.
      RAM_SIZE: 4G
      # CPU cores allocated to the Windows VM.
      CPU_CORES: 4
      # Size of the primary hard disk.
      DISK_SIZE: 64G
      # Edit here to set a custom Windows username. The default is 'MyWindowsUser'.
      USERNAME: martin
      # Edit here to set a password for the Windows user. The default is 'MyWindowsPassword'.
      # The password is read from the winapps.env file
      # PASSWORD: MyWindowsPassword
      # Set path to Linux user home folder.
      HOME: ${HOME}
      KEYBOARD: no-NO
      AUTOLOGIN: N
    ports:
      # Map '8006' on Linux host to '8006' on Windows VM --> For VNC Web Interface @ http://127.0.0.1:8006.
      - 127.0.0.1:8006:8006
      # Map '3389' on Linux host to '3389' on Windows VM --> For Remote Desktop Protocol (RDP).
      - 127.0.0.1:3389:3389/tcp
      - 127.0.0.1:3389:3389/udp
      # Uncomment the next two lines and comment out the two above to expose RDP to the local network.
      # - 3389:3389/tcp
      # - 3389:3389/udp
    cap_add:
      # Add network permission
      - NET_ADMIN
      # Required by dnsmasq for dockur's NAT networking; without it the container falls back to user-mode (passt) networking, which breaks RDP port forwarding from the host
      - NET_RAW
    # Wait 120 seconds before sending SIGTERM when attempting to shut down the Windows VM.
    stop_grace_period: 120s
    # Restart the Windows VM if the exit code indicates an error.
    restart: on-failure
    volumes:
      # Mount volume 'data' to use as Windows 'C:' drive.
      - data:/storage
      # Mount Linux user home directory @ '\\host.lan\Data'.
      - ${HOME}:/shared
      # Enables automatic post-install execution of 'oem/install.bat', applying Windows registry modifications contained within 'oem/RDPApps.reg'.
      - ./oem:/oem
      # Uncomment to use a custom Windows ISO. If specified, 'VERSION' (e.g. 'tiny11') will be ignored.
      #- /path/to/windows/install/media.iso:/custom.iso
    devices:
      # Enable KVM
      - /dev/kvm
      # Enable tuntap
      - /dev/net/tun
